apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting-gateway
  labels:
    app: accounting-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounting-gateway
  template:
    metadata:
      labels:
        app: accounting-gateway
    spec:
      containers:
        - name: accounting-gateway
          image: accounting-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
            - name: KEYCLOAK_URL
              value: "http://accounting-keycloak:8080/realms/accounting"
            - name: APP_SIGNING_KEY
              value: "12345"
            - name: SPRING_DATA_REDIS_HOST
              value: "accounting-gateway-redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: APP_ORGANIZATION_SERVICE_LOCATION
              value: "http://accounting-organization"
            - name: APP_ORGANIZATION_LEDGER_LOCATION
              value: "http://accounting-ledger"
            - name: APP_ROLE_SERVICE_LOCATION
              value: "http://accounting-authz"
          livenessProbe:
            httpGet:
              port: 8000
              path: /actuator/health/liveness
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              port: 8000
              path: /actuator/health/readiness
            initialDelaySeconds: 15
            periodSeconds: 15